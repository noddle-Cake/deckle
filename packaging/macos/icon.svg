<?xml version="1.0" encoding="UTF-8"?>
<!--
  Scanwise macOS app icon on Apple's 1024 px grid: an 824 px rounded rectangle (radius 185) centred at 100,100 with
  the standard drop shadow, as the HIG's macOS icon template asks for. Same design as Assets/scanwise.png.
  Rendered to packaging/macos/Scanwise.icns by scripts/make-icns.py.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E7BE0" />
      <stop offset="1" stop-color="#0058B8" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#EAF1FA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dy="12" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" />
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)" />

  <!-- Page -->
  <rect x="291" y="192" width="442" height="618" rx="34" fill="url(#paper)" />
  <g stroke="#6FA6DC" stroke-width="30" stroke-linecap="round">
    <line x1="368" y1="329" x2="656" y2="329" />
    <line x1="368" y1="413" x2="656" y2="413" />
    <line x1="368" y1="504" x2="580" y2="504" />
  </g>

  <!-- Scan bar -->
  <line x1="200" y1="627" x2="824" y2="627" stroke="#5AD2FA" stroke-width="70" stroke-linecap="round" opacity="0.55" filter="url(#glow)" />
  <line x1="200" y1="627" x2="824" y2="627" stroke="#5AD2FA" stroke-width="52" stroke-linecap="round" />
</svg>
